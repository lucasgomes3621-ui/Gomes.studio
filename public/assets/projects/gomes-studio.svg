<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1219" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Browser Frame -->
  <rect x="0" y="0" width="600" height="380" rx="10" fill="url(#bgGrad2)" stroke="rgba(0, 102, 255, 0.3)" stroke-width="1.5" />
  
  <!-- Browser Header bar -->
  <rect x="0" y="0" width="600" height="40" rx="10" fill="#131722" />
  <circle cx="24" cy="20" r="4" fill="#EF4444" />
  <circle cx="38" cy="20" r="4" fill="#F59E0B" />
  <circle cx="52" cy="20" r="4" fill="#10B981" />
  <rect x="80" y="10" width="230" height="20" rx="4" fill="#1B2232" />
  <text x="92" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">gomesstudio.design/portfolio</text>

  <!-- Navigation bar inside app -->
  <rect x="30" y="58" width="80" height="12" rx="3" fill="#38BDF8" />
  <rect x="370" y="60" width="45" height="8" rx="2" fill="#475569" />
  <rect x="425" y="60" width="45" height="8" rx="2" fill="#475569" />
  <rect x="480" y="60" width="45" height="8" rx="2" fill="#475569" />
  <rect x="535" y="55" width="35" height="18" rx="4" fill="#0066FF" />

  <!-- Hero Content inside Mockup -->
  <rect x="30" y="95" width="320" height="22" rx="4" fill="#FFFFFF" />
  <rect x="30" y="125" width="280" height="10" rx="2" fill="#94A3B8" />
  <rect x="30" y="142" width="240" height="10" rx="2" fill="#64748B" />

  <!-- Central Highlight Button in screenshot: STUDIO SHOWCASE -->
  <g transform="translate(180, 175)">
    <rect x="0" y="0" width="240" height="36" rx="6" fill="#0066FF" stroke="#38BDF8" stroke-width="1.5" />
    <text x="120" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">
      STUDIO SHOWCASE
    </text>
  </g>

  <!-- Two wide architectural blocks -->
  <g transform="translate(30, 235)">
    <rect x="0" y="0" width="260" height="115" rx="6" fill="#141923" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="16" y="18" width="100" height="10" rx="2" fill="#38BDF8" />
    <rect x="16" y="38" width="220" height="8" rx="2" fill="#64748B" />
    <rect x="16" y="52" width="180" height="8" rx="2" fill="#64748B" />
    <rect x="16" y="78" width="70" height="18" rx="3" fill="#0066FF" opacity="0.8" />

    <rect x="280" y="0" width="260" height="115" rx="6" fill="#141923" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="296" y="18" width="110" height="10" rx="2" fill="#38BDF8" />
    <rect x="296" y="38" width="220" height="8" rx="2" fill="#64748B" />
    <rect x="296" y="52" width="190" height="8" rx="2" fill="#64748B" />
    <rect x="296" y="78" width="70" height="18" rx="3" fill="#0066FF" opacity="0.8" />
  </g>

  <!-- Ambient blue orbit in top-right -->
  <circle cx="480" cy="115" r="45" fill="none" stroke="url(#blueAccent)" stroke-width="2" stroke-dasharray="8 4" opacity="0.5" />
</svg>
