<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="sphereDark" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1B2B48" />
      <stop offset="40%" stop-color="#0E1626" />
      <stop offset="85%" stop-color="#070A10" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background bloom -->
  <circle cx="300" cy="225" r="210" fill="url(#haloGlow)" />

  <!-- Outer Elliptical Orbit Rings -->
  <ellipse cx="300" cy="225" rx="260" ry="110" fill="none" stroke="rgba(0, 102, 255, 0.4)" stroke-width="1.5" stroke-dasharray="8 6" transform="rotate(-15, 300, 225)" />
  <ellipse cx="300" cy="225" rx="240" ry="90" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" transform="rotate(25, 300, 225)" />

  <!-- Orbit Satellites / Nodes -->
  <circle cx="90" cy="180" r="4" fill="#38BDF8" filter="url(#bloom)" />
  <circle cx="510" cy="270" r="5" fill="#0066FF" filter="url(#bloom)" />
  <circle cx="360" cy="120" r="3" fill="#FFFFFF" />

  <!-- Main 3D Sphere Body -->
  <circle cx="300" cy="225" r="150" fill="url(#sphereDark)" stroke="url(#neonCyan)" stroke-width="2.5" />

  <!-- Globe Grid Lines on Sphere (clipped inside sphere) -->
  <g clip-path="url(#sphereClip)">
    <clipPath id="sphereClip">
      <circle cx="300" cy="225" r="148" />
    </clipPath>

    <!-- Parallels -->
    <ellipse cx="300" cy="225" rx="145" ry="45" fill="none" stroke="#0066FF" stroke-width="1.5" opacity="0.65" />
    <ellipse cx="300" cy="225" rx="145" ry="95" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" />
    <ellipse cx="300" cy="170" rx="130" ry="35" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4" />
    <ellipse cx="300" cy="280" rx="130" ry="35" fill="none" stroke="#0066FF" stroke-width="1.2" opacity="0.4" />
    
    <!-- Meridians -->
    <ellipse cx="300" cy="225" rx="55" ry="145" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.75" />
    <ellipse cx="300" cy="225" rx="110" ry="145" fill="none" stroke="#0066FF" stroke-width="1.2" opacity="0.55" />
    <line x1="150" y1="225" x2="450" y2="225" stroke="#38BDF8" stroke-width="1.8" opacity="0.8" />
    <line x1="300" y1="75" x2="300" y2="375" stroke="#38BDF8" stroke-width="1.8" opacity="0.8" />
  </g>

  <!-- Central Brand Emblem / Insignia (as on mockup screenshot) -->
  <g transform="translate(195, 140)">
    <!-- Insignia Box -->
    <rect x="0" y="0" width="210" height="170" rx="14" fill="rgba(8, 11, 16, 0.88)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#bloom)" />
    
    <!-- Inner Globe Icon -->
    <g transform="translate(65, 18)">
      <circle cx="40" cy="40" r="34" fill="#0E1626" stroke="#38BDF8" stroke-width="2" />
      <ellipse cx="40" cy="40" rx="28" ry="11" fill="none" stroke="#38BDF8" stroke-width="1.2" />
      <ellipse cx="40" cy="40" rx="11" ry="34" fill="none" stroke="#0066FF" stroke-width="1.2" />
      <line x1="6" y1="40" x2="74" y2="40" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="40" y1="6" x2="40" y2="74" stroke="#38BDF8" stroke-width="1.5" />
      <!-- Pointer -->
      <polygon points="36,36 54,44 46,47 50,57 45,59 41,50 35,53" fill="#FFFFFF" stroke="#0066FF" stroke-width="1" />
    </g>

    <!-- Brand Name Text inside Insignia -->
    <text x="105" y="122" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="0.06em" fill="#FFFFFF" text-anchor="middle">
      GOMES <tspan fill="#38BDF8">STUDIO</tspan>
    </text>

    <!-- Slogan text inside Insignia -->
    <text x="105" y="142" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="600" letter-spacing="0.14em" fill="#94A3B8" text-anchor="middle">
      DESIGN QUE <tspan fill="#38BDF8">CONECTA</tspan>, SOLUÇÕES QUE IMPULSIONAM
    </text>
  </g>
</svg>
