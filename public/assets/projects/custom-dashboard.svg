<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111620" />
      <stop offset="100%" stop-color="#0A0D13" />
    </linearGradient>
  </defs>

  <!-- Browser Frame -->
  <rect x="0" y="0" width="600" height="380" rx="10" fill="url(#bgGrad3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  
  <!-- Browser Header bar -->
  <rect x="0" y="0" width="600" height="40" rx="10" fill="#151A24" />
  <circle cx="24" cy="20" r="4" fill="#EF4444" />
  <circle cx="38" cy="20" r="4" fill="#F59E0B" />
  <circle cx="52" cy="20" r="4" fill="#10B981" />
  <rect x="80" y="10" width="220" height="20" rx="4" fill="#1C2330" />
  <text x="92" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">enterprise.app/dashboard</text>

  <!-- Mini Sidebar -->
  <rect x="20" y="55" width="40" height="305" rx="6" fill="#161C27" />
  <circle cx="40" cy="75" r="8" fill="#0066FF" />
  <rect x="30" y="100" width="20" height="6" rx="2" fill="#4B5563" />
  <rect x="30" y="120" width="20" height="6" rx="2" fill="#4B5563" />
  <rect x="30" y="140" width="20" height="6" rx="2" fill="#4B5563" />
  <rect x="30" y="160" width="20" height="6" rx="2" fill="#4B5563" />

  <!-- Top bar in dashboard -->
  <rect x="80" y="58" width="120" height="12" rx="3" fill="#10B981" opacity="0.8" />
  <rect x="470" y="55" width="100" height="22" rx="4" fill="#1F2937" />

  <!-- 3 Metric Cards -->
  <g transform="translate(80, 85)">
    <rect x="0" y="0" width="150" height="65" rx="6" fill="#161D28" stroke="rgba(255, 255, 255, 0.06)" />
    <rect x="14" y="14" width="70" height="8" rx="2" fill="#9CA3AF" />
    <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">R$ 142.850</text>
    <text x="100" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">+28.4%</text>

    <rect x="170" y="0" width="150" height="65" rx="6" fill="#161D28" stroke="rgba(255, 255, 255, 0.06)" />
    <rect x="184" y="14" width="70" height="8" rx="2" fill="#9CA3AF" />
    <text x="184" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">1.840</text>
    <text x="240" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">+14.2%</text>

    <rect x="340" y="0" width="150" height="65" rx="6" fill="#161D28" stroke="rgba(255, 255, 255, 0.06)" />
    <rect x="354" y="14" width="70" height="8" rx="2" fill="#9CA3AF" />
    <text x="354" y="44" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF">99.8%</text>
    <text x="420" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">ALTO</text>
  </g>

  <!-- Button in screenshot: CUSTOM DASHBOARD -->
  <g transform="translate(180, 168)">
    <rect x="0" y="0" width="240" height="34" rx="6" fill="#1F2937" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="120" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.1em">
      CUSTOM DASHBOARD
    </text>
  </g>

  <!-- Large Chart / Table Visualization Area -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="490" height="130" rx="6" fill="#141A24" stroke="rgba(255, 255, 255, 0.08)" />
    <!-- Chart Grid Lines -->
    <line x1="20" y1="30" x2="470" y2="30" stroke="rgba(255, 255, 255, 0.05)" />
    <line x1="20" y1="60" x2="470" y2="60" stroke="rgba(255, 255, 255, 0.05)" />
    <line x1="20" y1="90" x2="470" y2="90" stroke="rgba(255, 255, 255, 0.05)" />
    <!-- Wave / Polyline Chart -->
    <path d="M 30,95 Q 100,50 160,70 T 280,40 T 380,65 T 460,25" fill="none" stroke="#0066FF" stroke-width="2.5" />
    <path d="M 30,105 Q 100,80 160,85 T 280,60 T 380,80 T 460,50" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" />
  </g>
</svg>
