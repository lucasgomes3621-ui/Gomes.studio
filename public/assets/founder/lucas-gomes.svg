<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <linearGradient id="studioDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131C" />
      <stop offset="60%" stop-color="#0A0C11" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="deskLight" cx="65%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0066FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Ambient Canvas -->
  <rect width="500" height="420" rx="12" fill="url(#studioDark)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Radial Desk Glow -->
  <rect width="500" height="420" rx="12" fill="url(#deskLight)" />

  <!-- Architectural Background Grids & Studio Ceiling Lights -->
  <line x1="40" y1="40" x2="120" y2="40" stroke="#FFFFFF" stroke-width="2" opacity="0.15" />
  <line x1="40" y1="50" x2="90" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.1" />
  <circle cx="50" cy="50" r="3" fill="#38BDF8" />
  <circle cx="65" cy="50" r="3" fill="#0066FF" />

  <!-- Studio Screen on Wall in Background -->
  <rect x="50" y="80" width="130" height="90" rx="4" fill="#131822" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  <line x1="60" y1="95" x2="120" y2="95" stroke="#38BDF8" stroke-width="2" opacity="0.4" />
  <line x1="60" y1="105" x2="150" y2="105" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="115" x2="140" y2="115" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="125" x2="110" y2="125" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="140" x2="160" y2="140" stroke="#0066FF" stroke-width="2" opacity="0.6" />

  <!-- Desk Surface -->
  <path d="M 0,330 L 500,320 L 500,420 L 0,420 Z" fill="#0E1219" />
  <line x1="0" y1="320" x2="500" y2="310" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Laptop with glowing display and keyboard -->
  <g transform="translate(60, 240)">
    <!-- Base -->
    <polygon points="20,80 140,80 160,86 0,86" fill="#1E293B" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <rect x="50" y="82" width="40" height="2" fill="#38BDF8" opacity="0.6" />
    <!-- Screen Opened -->
    <polygon points="30,15 130,15 140,80 20,80" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Code on laptop screen -->
    <line x1="40" y1="28" x2="90" y2="28" stroke="#38BDF8" stroke-width="2" />
    <line x1="45" y1="38" x2="120" y2="38" stroke="#60A5FA" stroke-width="1.5" />
    <line x1="45" y1="46" x2="110" y2="46" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="40" y1="56" x2="80" y2="56" stroke="#34D399" stroke-width="2" />
    <line x1="45" y1="66" x2="105" y2="66" stroke="#F472B6" stroke-width="1.5" />
    <!-- Laptop screen glow cast -->
    <polygon points="30,15 130,15 180,140 -20,140" fill="url(#neonGlow)" opacity="0.08" />
  </g>

  <!-- Founder Figure (Lucas Gomes in thoughtful focus, profile view) -->
  <g transform="translate(200, 100)">
    <!-- Ambient back light on founder's back -->
    <!-- Head & Hair profile -->
    <path d="M 120,40 C 120,20 100,5 75,5 C 55,5 45,15 40,30 C 35,40 38,55 42,60 C 44,65 48,68 50,75 C 53,82 56,92 56,105 L 80,105 C 85,95 86,85 92,80 C 105,78 120,65 120,40 Z" fill="#1C212D" stroke="#38BDF8" stroke-width="1.2" opacity="0.95" />
    
    <!-- Face profile line lit by screen -->
    <path d="M 40,35 C 36,45 32,55 28,62 C 26,67 29,70 34,70 C 38,70 37,76 34,79 C 32,82 35,88 38,89 C 42,90 44,98 44,106" fill="none" stroke="#93C5FD" stroke-width="1.8" />
    
    <!-- Ear & Jawline detail -->
    <path d="M 60,55 C 58,60 58,68 62,72" fill="none" stroke="#60A5FA" stroke-width="1.2" />
    
    <!-- Dark Jacket / Blazer -->
    <path d="M 44,106 C 30,120 15,150 5,185 C -5,220 -8,250 -10,280 L 140,280 C 145,240 140,180 125,140 C 115,115 90,106 80,105 Z" fill="#111622" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" />
    
    <!-- Blue rim light on shoulder and back -->
    <path d="M 80,105 C 105,115 120,145 130,190 C 138,230 140,265 142,280" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.85" filter="url(#softGlow)" />
    
    <!-- Shirt Collar -->
    <polygon points="44,106 58,135 72,110 58,106" fill="#0B0D11" stroke="#0066FF" stroke-width="1.5" />
    
    <!-- Hand on keyboard typing -->
    <path d="M -10,230 C -25,240 -40,250 -60,255 C -65,256 -68,262 -65,266 C -60,270 -50,268 -40,263 L -10,255" fill="#1C212D" stroke="#38BDF8" stroke-width="1" />
  </g>

  <!-- Floating Status Badge inside Founder Box -->
  <g transform="translate(24, 370)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="rgba(11, 13, 17, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#10B981" />
    <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#E2E8F0" letter-spacing="0.1em">
      LUCAS GOMES • FOUNDER
    </text>
  </g>
</svg>
