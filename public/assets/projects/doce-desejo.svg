<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181419" />
      <stop offset="100%" stop-color="#0F0D12" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
  </defs>

  <!-- Browser Frame -->
  <rect x="0" y="0" width="600" height="380" rx="10" fill="url(#bgGrad1)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Browser Header bar -->
  <rect x="0" y="0" width="600" height="40" rx="10" fill="#1C1820" />
  <circle cx="24" cy="20" r="4" fill="#EF4444" />
  <circle cx="38" cy="20" r="4" fill="#F59E0B" />
  <circle cx="52" cy="20" r="4" fill="#10B981" />
  <rect x="80" y="10" width="220" height="20" rx="4" fill="#251F2C" />
  <text x="92" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">docedesejo.com.br/cardapio</text>

  <!-- Navigation bar inside app -->
  <rect x="30" y="60" width="100" height="14" rx="3" fill="#E11D48" opacity="0.8" />
  <rect x="420" y="60" width="40" height="10" rx="2" fill="#4B5563" />
  <rect x="470" y="60" width="40" height="10" rx="2" fill="#4B5563" />
  <rect x="520" y="58" width="50" height="16" rx="4" fill="url(#roseAccent)" />

  <!-- Hero Content inside Mockup -->
  <rect x="30" y="95" width="260" height="18" rx="4" fill="#FFFFFF" opacity="0.9" />
  <rect x="30" y="122" width="220" height="10" rx="2" fill="#9CA3AF" opacity="0.7" />
  <rect x="30" y="138" width="180" height="10" rx="2" fill="#9CA3AF" opacity="0.5" />

  <!-- Interactive Button in screenshot -->
  <g transform="translate(30, 165)">
    <rect x="0" y="0" width="200" height="34" rx="6" fill="#E11D48" />
    <text x="100" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">
      CARDÁPIO &amp; PEDIDOS
    </text>
  </g>

  <!-- Product Catalog Cards Grid -->
  <g transform="translate(30, 220)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="165" height="130" rx="6" fill="#221C26" stroke="rgba(225, 29, 72, 0.25)" stroke-width="1" />
    <rect x="12" y="12" width="141" height="60" rx="4" fill="#362939" />
    <text x="82" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" text-anchor="middle">🧁</text>
    <rect x="12" y="82" width="90" height="8" rx="2" fill="#FFFFFF" opacity="0.8" />
    <rect x="12" y="96" width="50" height="6" rx="2" fill="#FB7185" />
    <rect x="12" y="108" width="40" height="10" rx="2" fill="#E11D48" />

    <!-- Card 2 -->
    <rect x="185" y="0" width="165" height="130" rx="6" fill="#221C26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="197" y="12" width="141" height="60" rx="4" fill="#362939" />
    <text x="267" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" text-anchor="middle">🎂</text>
    <rect x="197" y="82" width="100" height="8" rx="2" fill="#FFFFFF" opacity="0.8" />
    <rect x="197" y="96" width="60" height="6" rx="2" fill="#FB7185" />
    <rect x="197" y="108" width="40" height="10" rx="2" fill="#E11D48" />

    <!-- Card 3 -->
    <rect x="370" y="0" width="170" height="130" rx="6" fill="#221C26" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <rect x="382" y="12" width="146" height="60" rx="4" fill="#362939" />
    <text x="455" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" text-anchor="middle">🍓</text>
    <rect x="382" y="82" width="95" height="8" rx="2" fill="#FFFFFF" opacity="0.8" />
    <rect x="382" y="96" width="55" height="6" rx="2" fill="#FB7185" />
    <rect x="382" y="108" width="40" height="10" rx="2" fill="#E11D48" />
  </g>

  <!-- Right Floating Showcase Image Preview -->
  <g transform="translate(340, 85)">
    <rect x="0" y="0" width="230" height="110" rx="8" fill="#2B1F2D" stroke="rgba(225, 29, 72, 0.3)" stroke-width="1.5" />
    <circle cx="115" cy="55" r="35" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="115" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" text-anchor="middle">🍰</text>
  </g>
</svg>
